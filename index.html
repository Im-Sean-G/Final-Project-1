<!doctype html>
<html lang="en">
  <head>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Streamr | Everything you wanted to know about your favorite movies
    </title>
    <meta
      name="description"
      content="Streamr | Everything you wanted to know about your favorite movies"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/e8cebabe41.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="app">
      <div class="nav">
        <div class="logo">
          <h1>Streamr</h1>
        </div>
        <div class="nav__links">
          <ul>
            <li><a class="nav__link" href="index.html">Home</a></li>
            <li><a class="nav__link" href="movies.html">Movies</a></li>
            <li><a class="nav__link" href="#">About</a></li>
          </ul>
        </div>
      </div>
      <section id="landing-page">
        <div class="landing__wrapper">
          <div class="landing__header">
            <h2>Welcome to Streamr</h2>
          </div>
          <div class="landing__subheader">
            <p>
              Everything you wanted to know <br />about your
              <span class="purple">favorite movies</span>
            </p>
          </div>
          <div class="search">
            <input
              class="search__input"
              type="text"
              placeholder="Search for a movie..."
              id="search-input"
            />
            <button class="search__button not__loading" type="button">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
          <div class="movie__image">
            <img
              src="undraw_home-cinema_jdm1.svg"
              alt="Home cinema illustration"
            />
          </div>
        </div>
      </section>
    </div>
     <footer>
      <p>&copy; 2024 Streamr. All rights reserved.</p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
