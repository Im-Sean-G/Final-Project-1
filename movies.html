<!doctype html>
<html lang="en">
  <head>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies | Streamr</title>
    <meta name="description" content="Browse movies on Streamr" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/e8cebabe41.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="movies-page-body">
    <div class="movies__nav">
      <div class="nav">
        <div class="logo">
          <h1>Streamr</h1>
        </div>
        <div class="nav__links">
          <ul>
            <li><a class="nav__link" href="index.html">Home</a></li>
            <li><a class="nav__link" href="movies.html">Movies</a></li>
            <li><a class="nav__link b" href="#">About</a></li>
          </ul>
        </div>
      </div>
    </div>
    <section id="movies-page">
      <div class="search__header">
        <h2 class="search__header-title">Search for your favorite movies:</h2>
        <div class="search">
          <input
            class="search__input--movies"
            type="text"
            placeholder="Search for a movie..."
            id="search-input"
          />
          <button class="search__button--movies not__loading" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
    </section>
    <div class="movies__wrapper">
      <div class="movies__toolbar">
        <label for="movie-sort">Sort by</label>
        <select id="movie-sort">
          <option value="title">Title (A-Z)</option>
          <option value="year">Year (newest)</option>
          <option value="year-oldest">Year (oldest)</option>
          <option value="rating">IMDb rating (highest)</option>
          <option value="rating-lowest">IMDB Rating (lowest)</option>
    </select>
  </div>
      <div class="movies__grid" id="movies-grid"></div>
    </div>
    <footer class="footer">
      <div class="footer__links--wrapper">
        <ul class="footer__links">
          <li><a class="footer__link" href="index.html">Home</a></li>
          <li><a class="footer__link" href="movies.html">Movies</a></li>
          <li><a class="footer__link b" href="#">About</a></li>
        </ul>
      </div>
      <div class="footer__copyright">
        &copy; 2024 Streamr. All rights reserved.
      </div>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
